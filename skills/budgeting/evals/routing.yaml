should_fire:
  - 'build an annual operating expense (OpEx) budget for our engineering team'
  - 'conduct a monthly budget vs actual variance analysis to find cost overruns'
  - 'establish department spending limits and travel budget guidelines for employees'
  - 'model hiring headcount costs including benefits, taxes, and equipment stipends'
  - 'create a zero-based budget requiring managers to justify all annual expenses'
  - 'reforecast our annual company budget after missing quarterly revenue targets'
  - 'allocate discretionary marketing and engineering budgets across quarters'
  - 'track capital expenditures (CapEx) against our approved annual capital budget'
should_not_fire:
